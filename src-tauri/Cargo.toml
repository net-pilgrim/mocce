[package]
name = "mocce"
version = "0.1.0"
description = "MOCCE - My Own CCXML Editor"
authors = ["dsv"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"

[lib]
name = "mocce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
